@"
version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       sbsdb
      POSTGRES_USER:     sbsadmin
      POSTGRES_PASSWORD: localpassword
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sbsadmin -d sbsdb']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5

  auth-service:
    build:
      context: ../app/auth-service
    ports:
      - '8081:8081'
    environment:
      DB_HOST:     postgres
      DB_NAME:     sbsdb
      DB_USER:     sbsadmin
      DB_PASSWORD: localpassword
      REDIS_HOST:  redis
      JWT_SECRET:  sbs-local-secret-key
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}

  account-service:
    build:
      context: ../app/account-service
    ports:
      - '8082:8082'
    environment:
      DB_HOST:     postgres
      DB_NAME:     sbsdb
      DB_USER:     sbsadmin
      DB_PASSWORD: localpassword
    depends_on:
      postgres: {condition: service_healthy}

  txn-service:
    build:
      context: ../app/txn-service
    ports:
      - '8083:8083'
    environment:
      DB_HOST:     postgres
      DB_NAME:     sbsdb
      DB_USER:     sbsadmin
      DB_PASSWORD: localpassword
    depends_on:
      postgres: {condition: service_healthy}

  loan-service:
    build:
      context: ../app/loan-service
    ports:
      - '8084:8084'
    environment:
      DB_HOST:     postgres
      DB_NAME:     sbsdb
      DB_USER:     sbsadmin
      DB_PASSWORD: localpassword
    depends_on:
      postgres: {condition: service_healthy}

volumes:
  postgres_data:
"@ | Out-File -FilePath docker\docker-compose.yml -Encoding utf8